    <path d="M47 82q0-5 12-10l82-34q11-5 24-2l96 25q18 5 7 12l-84 37q-10 4-23 1L59 85q-7-1-12-3Z" fill="url(#rm-top)" stroke="#e1eae6" stroke-width="1.1"/>
    <use xlink:href="#rm-top-emblem" transform="matrix(1 .26 -1 .43 158 72)"/>
    <g transform="matrix(1 .25 0 1 67 109)" fill="#35494d"><rect width="13" height="4" rx="1.8"/><rect x="18" width="13" height="4" rx="1.8"/><circle cx="43" cy="2" r="2.3"/><circle cx="87" cy="2" r="1.5" fill="#f4faf5"/></g>
  </symbol>
  <symbol id="rm-mac-studio" viewBox="0 0 320 200">
    <ellipse cx="162" cy="171" rx="133" ry="17" fill="url(#rm-shadow)"/>
    <path d="M48 64q-1-5 12-10l82-31q9-4 20-2l99 23q13 4 13 10v72q0 7-10 12l-82 34q-10 4-23 1L58 149q-10-2-10-10Z" fill="url(#rm-face)"/>
    <path d="M49 60q0-4 11-8l82-31q11-4 21-2l99 24q17 4 9 11l-88 36q-10 4-22 1L58 65q-8-2-9-5Z" fill="url(#rm-top)" stroke="#e1eae6" stroke-width="1.1"/>
    <use xlink:href="#rm-top-emblem" transform="matrix(1 .24 -1 .42 159 56)"/>
    <g transform="matrix(1 .25 0 1 69 119)" fill="#384d51"><rect width="10.5" height="4" rx="1.4"/><rect x="15" width="10.5" height="4" rx="1.4"/><rect x="53" y="1" width="21" height="2.3" rx=".9"/><circle cx="82" cy="2" r="1.5" fill="#f6fbf4"/></g>
    <path d="m180 168 81-34" stroke="#51666a" opacity=".65" stroke-width="1.5"/>
  </symbol>
  <symbol id="rm-macbook-pro" viewBox="0 0 320 200">
    <ellipse cx="155" cy="163" rx="139" ry="16" fill="url(#rm-shadow)"/>
    <g transform="translate(-4 -4) scale(1.03 1.04)" style="--rm-sky:#667f9b;--rm-haze:#b5c6ce;--rm-hill:#657d92;--rm-ridge:#426074;--rm-fore:#244352;color:#819398">
      <use xlink:href="#rm-notebook-display" transform="matrix(1 .039 -.09 1 82 18)"/>
      <path d="m154 20 26 1-.5 4q-.3 2-2 1.9l-21-.8q-2-.1-2-2Z" fill="#252f31"/>
      <use xlink:href="#rm-notebook-deck" fill="url(#rm-dark)" style="--rm-lip:#586c73"/>
      <path d="m40 151 29 3 205 6.3" fill="none" stroke="#596c70" stroke-width="2.4"/>
