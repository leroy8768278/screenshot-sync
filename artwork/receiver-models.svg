    <path d="m89 51 76 14 65-33-77-13Z" fill="url(#rm-top)" stroke="#becac7" stroke-width="1.1"/>
    <path d="m164 65 66-32v107l-66 36Z" fill="url(#rm-face)" stroke="#83989b" stroke-width="1.1"/>
    <path d="m90 49 75 14v111l-75-14Z" fill="url(#rm-top)" stroke="#a3b5b5" stroke-width="1.2"/>
    <g transform="matrix(1 .19 0 1 97 57)"><rect width="61" height="97" fill="url(#rm-holes)"/></g>
    <path d="m96 158 6 1v12l-4 1-3-2Zm62 12 6 1v12l-4 1-3-2Zm63-31 6-2v9l-5 3-1-2Z" fill="#6a8184"/>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="m95 49 .5-11q.1-5.5 6-4.4l52.3 10q5.8 1.2 5.7 7.1l-.2 11.2m.7-41.2v-9.5q0-4.6 5.4-3.8l53.3 9.6q5.7 1.1 5.7 6.6v9.4" stroke="#7f9395" stroke-width="5.7"/>
      <path d="m94.8 46 .6-9.4q.6-4.8 6.5-3.5l50.8 9.5m7.4-24.3v-8q.1-3.7 5.3-2.9l51.2 9.2" stroke="#e5ece7" stroke-width="2.1"/>
    </g>
