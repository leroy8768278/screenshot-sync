    <g transform="matrix(1.10 .045 0 1.02 64 13)" style="--rm-sky:#89aaa4;--rm-haze:#e5ebd4;--rm-hill:#abc5b5;--rm-ridge:#77a494;--rm-fore:#498878">
      <rect x="-5" y="-3" width="184" height="134" rx="6" fill="#789b93"/>
      <rect x="-5" y="-4" width="181" height="132" rx="5.5" fill="#d9e5df" stroke="#eef6ee" stroke-width="1.1"/>
      <use xlink:href="#rm-landscape" transform="translate(-.8 1) scale(1 .99)"/>
      <path d="M-5 108h181v15.5q0 4.5-5 4.5H0q-5 0-5-4.5Z" fill="#b1c9be"/>
      <circle cx="85" cy="-1.4" r="1.15" fill="#627975"/>
