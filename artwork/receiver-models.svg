    <rect x="91" y="40" width="138" height="118" rx="23" fill="url(#rm-face)"/>
    <rect x="92" y="38" width="136" height="115" rx="22" fill="url(#rm-top)" stroke="#ecf4ed" stroke-width="1.5"/>
    <rect x="105" y="51" width="110" height="87" rx="15" fill="#325953"/>
    <path d="M134 106V83l12 17 12-17v23m22-13q-14-3-14 6t11 5l3-4m0-7v13m19-12q-12-6-13 5 1 11 13 5" fill="none" stroke="#deeee5" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
