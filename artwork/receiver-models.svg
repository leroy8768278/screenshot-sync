        <rect x="53" y="32" width="43" height="3" rx="1" fill="var(--rm-space,#2a3d42)"/>
        <rect x="51" y="38" width="52" height="13" rx="2.4" fill="none" stroke="var(--rm-track,#80999a)" stroke-width="1.4"/>
      </g>
      <path d="M39 148q-3-.5-2.4-2.2-1.2 3.1 2.6 4.2l31.1 3 204.7 6.3q5.4-.3 3.2-3.6-1.1 1.6-4 1.7l-204-6.2Z" fill="var(--rm-lip,#8d9c9f)"/>
      <path d="m137 153.5 32.5.9" stroke="#536569" opacity=".7" stroke-width="1.4" stroke-linecap="round"/>
    </g>
