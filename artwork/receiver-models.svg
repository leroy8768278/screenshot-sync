      <path d="m155 27 23 .8-.3 2.8q-.1 1.5-2 1.5l-19-.7q-1.6 0-1.6-1.4Z" fill="#253638"/>
      <use xlink:href="#rm-notebook-deck" fill="url(#rm-air)"/>
    </g>
  </symbol>
  <symbol id="rm-macbook-neo" viewBox="0 0 320 200">
    <ellipse cx="158" cy="163" rx="123" ry="14" fill="url(#rm-shadow)"/>
    <g transform="translate(9 11) scale(.94)" style="color:#cdd5a5;--rm-sky:#a2bb96;--rm-haze:#f0edce;--rm-hill:#bed1a1;--rm-ridge:#8ba884;--rm-fore:#587e68">
      <use xlink:href="#rm-notebook-display" transform="matrix(1 .039 -.09 .96 82 22)"/>
      <use xlink:href="#rm-notebook-deck" fill="url(#rm-neo)" style="--rm-key-fill:url(#rm-keys-light);--rm-space:#f5f4da;--rm-lip:#9ba784"/>
    </g>
  </symbol>
  <symbol id="rm-macbook" viewBox="0 0 320 200">
