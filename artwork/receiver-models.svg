<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 320 200">
  <title>即图 · Mac 接收设备插图</title>
  <defs>
    <linearGradient id="rm-top" x1="0" y1="0" x2=".85" y2="1">
      <stop stop-color="#fbfdfc"/><stop offset=".54" stop-color="#dbe3e3"/><stop offset="1" stop-color="#b0bfc0"/>
    </linearGradient>
    <linearGradient id="rm-face" x1="0" y1="0" x2="1" y2=".08">
      <stop stop-color="#72888b"/><stop offset=".08" stop-color="#a8b7b8"/><stop offset=".52" stop-color="#c9d4d3"/><stop offset=".65" stop-color="#8c9fa0"/><stop offset=".96" stop-color="#586d71"/><stop offset="1" stop-color="#43595e"/>
    </linearGradient>
    <linearGradient id="rm-dark" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#acb9be"/><stop offset=".42" stop-color="#84959b"/><stop offset="1" stop-color="#4d6068"/>
    </linearGradient>
    <linearGradient id="rm-air" x2=".75" y2="1">
      <stop stop-color="#eff7f6"/><stop offset=".55" stop-color="#accac9"/><stop offset="1" stop-color="#86a5a8"/>
    </linearGradient>
    <linearGradient id="rm-neo" x2=".8" y2="1">
      <stop stop-color="#f3f4d8"/><stop offset=".55" stop-color="#dce4b3"/><stop offset="1" stop-color="#b7c69b"/>
    </linearGradient>
    <linearGradient id="rm-gold" x2=".85" y2="1">
      <stop stop-color="#f7e9d7"/><stop offset=".5" stop-color="#d8bc9e"/><stop offset="1" stop-color="#b49c85"/>
    </linearGradient>
    <linearGradient id="rm-glass" x1="0" y1="0" x2=".75" y2="1">
      <stop stop-color="#fbfff9" stop-opacity=".22"/><stop offset=".48" stop-color="#f9fcff" stop-opacity=".03"/><stop offset="1" stop-color="#071921" stop-opacity=".1"/>
    </linearGradient>
    <radialGradient id="rm-shadow"><stop stop-color="#23322e" stop-opacity=".4"/><stop offset=".65" stop-color="#1a3330" stop-opacity=".15"/><stop offset="1" stop-color="#19302d" stop-opacity="0"/></radialGradient>
    <pattern id="rm-keys" patternUnits="userSpaceOnUse" width="10" height="6"><rect x=".7" y=".6" width="8.3" height="4.3" rx=".8" fill="#26393e"/></pattern>
    <pattern id="rm-keys-light" patternUnits="userSpaceOnUse" width="10" height="6"><rect x=".7" y=".6" width="8.3" height="4.3" rx=".8" fill="#f5f4da" stroke="#acb597" stroke-width=".55"/></pattern>
    <pattern id="rm-holes" patternUnits="userSpaceOnUse" width="8" height="12"><circle cx="2.2" cy="2.5" r="1.7" fill="#5c7174"/><circle cx="6.1" cy="8.5" r="1.7" fill="#52676b"/><path d="M1 4a2 2 0 0 0 2.5-.3m1.2 5.6a2 2 0 0 0 2.5-.3" fill="none" stroke="#e0e9e5" stroke-width=".7"/></pattern>
    <clipPath id="rm-screen-clip"><rect width="172" height="103" rx="3.8"/></clipPath>
    <g id="rm-landscape" clip-path="url(#rm-screen-clip)">
      <rect width="172" height="103" fill="var(--rm-sky,#94b9b4)"/>
      <path d="M-12 71C32 73 54 24 101 37c33 9 45 4 79-11v85H-12Z" fill="var(--rm-haze,#d0ded0)"/>
      <path d="M-9 76c49-32 61-8 94-13 32-4 45-35 99-30v78H-9Z" fill="var(--rm-hill,#689e90)"/>
      <path d="M-10 93c46-6 54-29 91-22 35 7 51-20 101-27v69H-10Z" fill="var(--rm-ridge,#42746d)"/>
      <path d="M-8 104c41-29 60-17 101-27 38-9 50-8 89-17v51H-8Z" fill="var(--rm-fore,#235750)"/>
      <rect width="172" height="103" fill="url(#rm-glass)"/>
    </g>
    <g id="rm-notebook-display">
      <rect x="-4.4" y="-4.5" width="181" height="114" rx="6.3" fill="#263134" stroke="currentColor" stroke-width="2.3"/>
      <use xlink:href="#rm-landscape"/><rect x="1" y="104" width="170" height="3.4" rx="1" fill="#202a2c"/>
    </g>
    <g id="rm-notebook-deck">
