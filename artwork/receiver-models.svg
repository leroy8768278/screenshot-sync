    <g transform="translate(16 10) scale(.90 .94)" style="color:#c2a88a;--rm-sky:#c9a58d;--rm-haze:#ebd7b9;--rm-hill:#c3a38c;--rm-ridge:#aa846e;--rm-fore:#805f53">
