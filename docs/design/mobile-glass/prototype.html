.scan-actions button{background:#d8eede;color:#214435;border-radius:10px;font-size:12px;font-weight:650;min-height:34px;padding:6px 10px}.pair-input{display:grid;gap:5px;font-size:12px;margin:10px 0;color:var(--sub)}
.pair-input input{color:var(--ink);background:white;border:1px solid #bdcbc1;border-radius:9px;padding:10px;width:100%;font-size:13px}.pair-error{color:var(--red);font-size:12px;line-height:1.5;margin:8px 0}
.scanner .pair-error{color:#ffd3b9}.pair-example{color:var(--brand);font-weight:600;font-size:12px;padding:3px 0 13px}
@media(max-width:720px){.scenario-bar{padding:6px 8px;background:#eef3ee;border-bottom:1px solid var(--line)}.scenario-switch button{padding:4px 12px}.phone{height:calc(100dvh - 87px);min-height:410px}.setup-visual{height:clamp(95px,17dvh,150px)}.setup-card{padding:19px}.scanner{padding-bottom:env(safe-area-inset-bottom)}}
@media(max-width:410px){.review-controls{gap:4px}.board-head{padding-inline:8px}.design-title span{display:none}}
.device:has(.mac-art)>h3,.device:has(.mac-art)>.device-top{margin-right:84px;overflow-wrap:anywhere}

 const cancelHold=()=>{clearTimeout(holdTimer);holdPos=null};
